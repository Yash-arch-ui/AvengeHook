[package]
name = "detox-rs"
version = "0.1.0"
edition = "2021"
description = "DetoxHook monitor and manager — Rust tooling for Uniswap V4 MEV protection hook"

[dependencies]
ethers = { version = "2.0", features = ["abigen", "ws", "rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
dotenv = "0.15"
eyre = "0.6"
chrono = "0.4"
